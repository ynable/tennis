<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎾 テニス組み合わせメーカー</title>
  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- ハンバーガーメニュー -->
  <header class="site-header">
    <a href="index.html" class="site-logo">🎾 テニス組み合わせ</a>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </button>
  </header>
  <nav class="drawer" id="drawer">
    <a href="index.html" class="drawer-link active">🏠 ホーム</a>
    <a href="singles.html" class="drawer-link">🎾 シングルス</a>
    <a href="doubles.html" class="drawer-link">🎾 ダブルス</a>
    <a href="league.html" class="drawer-link">🏆 リーグ戦</a>
  </nav>
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <main class="home-main">
    <div class="home-hero">
      <h1>🎾 テニス組み合わせメーカー</h1>
      <p class="hero-subtitle">モードを選んでスタート</p>
    </div>

    <div class="mode-cards">
      <a href="singles.html" class="mode-card mode-singles">
        <div class="mode-icon">🎾</div>
        <div class="mode-title">シングルス</div>
        <div class="mode-desc">1対1の試合を自動で組み合わせ</div>
      </a>
      <a href="doubles.html" class="mode-card mode-doubles">
        <div class="mode-icon">🎾</div>
        <div class="mode-title">ダブルス</div>
        <div class="mode-desc">2対2の試合をペア替えしながら組み合わせ</div>
      </a>
      <a href="league.html" class="mode-card mode-league">
        <div class="mode-icon">🏆</div>
        <div class="mode-title">リーグ戦 <span class="badge-new">NEW</span></div>
        <div class="mode-desc">総当たり形式のリーグ戦を管理</div>
      </a>
    </div>
  </main>

  <script src="nav.js"></script>
</body>
</html>
